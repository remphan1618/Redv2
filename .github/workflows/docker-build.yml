name: ci

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_PAT }}

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history if needed

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Set up Buildx with Cloud Driver
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "remphan/redviso"
          install: true

      - name: Build and Push Docker Image using Buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/visored:latest
          outputs: type=registry

      - name: Image Digest
        run: echo "Docker image built and pushed using Buildx." 
