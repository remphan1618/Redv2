name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Runs when changes are pushed to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Version Number
        id: version
        run: |
          # Get the number of commits on the main branch
          COMMIT_COUNT=$(git rev-list --count HEAD)
          # Create version based on date and commit count
          VERSION="$(date +'%Y%m%d')-${COMMIT_COUNT}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Generated version: ${VERSION}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/visored:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/visored:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/visored:latest
          cache-to: type=inline

      - name: Image Digest
        run: echo "Image has been pushed with tags 'latest' and '${{ env.VERSION }}'"