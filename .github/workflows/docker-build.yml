name: ci

on:
  push:
    branches:
      - main  # Trigger on pushes to the "main" branch

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx with Cloud Driver
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "remphan/redviso"
          install: true

      - name: Generate Version Number
        id: version
        run: |
          # Get the number of commits on the main branch
          COMMIT_COUNT=$(git rev-list --count HEAD)
          # Create a version string based on the current date and commit count
          VERSION="$(date +'%Y%m%d')-${COMMIT_COUNT}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Generated version: ${VERSION}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USER }}/visored:latest
            ${{ vars.DOCKER_USER }}/visored:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ vars.DOCKER_USER }}/visored:latest
          cache-to: type=inline
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}

      - name: Image Digest
        run: echo "Image has been pushed with tags 'latest' and '${{ env.VERSION }}'"
