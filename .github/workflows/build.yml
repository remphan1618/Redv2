name: ci

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  # Primary Job: Use GitHub Runners
  github_runners:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Log Debug Information
      - name: Log Debug Information
        run: |
          echo "Running job on ${{ runner.os }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Current disk space:"
          df -h

      # Step 3: Free Up Disk Space
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove large directories that aren't needed
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          
          # Remove apt cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "Disk space after cleanup:"
          df -h

      # Step 4: Clear Docker Cache
      - name: Clear Docker Cache
        run: |
          docker system prune -af

      # Step 5: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      # Step 6: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 7: Build and Push
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USER }}/redv2:latest
          cache-from: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:buildcache,mode=max
          # Increase the timeout for the build
          timeout-minutes: 120

    # Continue to the fallback job if this one fails
    continue-on-error: true

  # Fallback Job: Use Docker Cloud Builders
  docker_cloud_builders:
    needs: github_runners
    if: ${{ always() && needs.github_runners.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Log Debug Information
      - name: Log Debug Information
        run: |
          echo "Running job on ${{ runner.os }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
          
      # Step 4: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Step 5: Build and push using Docker Buildx
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USER }}/redv2:latest
          cache-from: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:buildcache,mode=max
          # Increase the timeout for the build
          timeout-minutes: 120
