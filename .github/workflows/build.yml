name: ci

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github_runners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_FINE_GRAINED_PAT }}

      - name: Log Debug Information
        run: |
          echo "Running job on ${{ runner.os }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Current disk space:"
          df -h

      # Additional disk cleanup BEFORE Docker build
      - name: Remove unnecessary files and free space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo docker system prune -af
          sudo rm -rf ~/.cache/pip
          sudo rm -rf ~/.cache/*
          echo "Disk space after cleanup:"
          df -h

      # Prevent Docker layer caching
      - name: Build and Push (no cache)
        run: |
          docker buildx build --no-cache --push --tag "${{ vars.DOCKER_USER }}/redv2:latest" .

    continue-on-error: true

  docker_cloud_builders:
    needs: github_runners
    if: ${{ always() && needs.github_runners.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_FINE_GRAINED_PAT }}

      - name: Log Debug Information
        run: |
          echo "Running job on ${{ runner.os }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"

      - name: Remove unnecessary files and free space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo docker system prune -af
          sudo rm -rf ~/.cache/pip
          sudo rm -rf ~/.cache/*
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (no cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USER }}/redv2:latest
          no-cache: true
          cache-from: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:buildcache,mode=max
