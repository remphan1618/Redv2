name: ci

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  # Primary Job: Use GitHub Runners
  github_runners:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Log Debug Information
        run: |
          echo "Running job on ${{ runner.os }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"

      # Step 3: Clear Docker Cache
      - name: Clear Docker Cache
        run: |
          docker system prune -af

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      # Step 5: Build and Push Image (Manual Retry Logic)
      - name: Build and Push
        run: |
          set -e
          for i in {1..3}; do
            echo "Attempt $i: Building Docker image..."
            if docker buildx build --push --tag "${{ vars.DOCKER_USER }}/github-runner-image:latest" .; then
              echo
