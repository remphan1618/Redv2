name: ci

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Clear Cache
      - name: Clear Cache
        uses: TheRealRyGuy/clear-cache-action@v0.1
        with:
          # This token is required for the action to work.
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Lint Dockerfile
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile
          config: ./.hadolint.yaml

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      # Step 5: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "remphan/name"
          install: true

      # Step 6: Build and push (base stage)
      - name: Build and push (base stage)
        uses: docker/build-push-action@v6
        with:
          target: base
          cache-from: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:cache
          cache-to: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:cache,mode=max
          tags: ${{ vars.DOCKER_USER }}/redv2:base

      # Step 7: Build and push (build stage)
      - name: Build and push (build stage)
        uses: docker/build-push-action@v6
        with:
          target: build
          cache-from: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:cache
          cache-to: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:cache,mode=max
          tags: ${{ vars.DOCKER_USER }}/redv2:build

      # Step 8: Build and push (runtime stage)
      - name: Build and push (runtime stage)
        uses: docker/build-push-action@v6
        with:
          target: runtime
          cache-from: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:cache
          cache-to: type=registry,ref=${{ vars.DOCKER_USER }}/redv2:cache,mode=max
          tags: ${{ vars.DOCKER_USER }}/redv2:latest

      # Step 9: Test Docker Image
      - name: Test Docker Image
        run: |
          docker run --rm ${{ vars.DOCKER_USER }}/redv2:latest python -c "import scikit_image"
          docker run --rm ${{ vars.DOCKER_USER }}/redv2:latest ls /workspace/VisoMaster

  docker_build_cloud_demo:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Clear Cache
      - name: Clear Cache
        uses: TheRealRyGuy/clear-cache-action@v0.1
        with:
          # This token is required for the action to work.
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      # Step 4: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "remphan/name"
          install: true

      # Step 5: Build and Push Image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          tags: "${{ vars.DOCKER_USER }}/docker-build-cloud-demo:latest"
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
