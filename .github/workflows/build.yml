name: ci

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  # Primary Job: Use GitHub Runners
  github_runners:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Log Debug Information
      - name: Log Debug Information
        run: |
          echo "Running job on ${{ runner.os }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"

      # Step 3: Clear Docker Cache
      - name: Clear Docker Cache
        run: |
          docker system prune -af

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      # Step 5: Build and Push Image (Manual Retry Logic)
      - name: Build and Push
        run: |
          set -e
          for i in {1..3}; do
            echo "Attempt $i: Building Docker image..."
            if docker buildx build --push --tag "${{ vars.DOCKER_USER }}/github-runner-image:latest" .; then
              echo "Build succeeded!"
              break
            elif [ $i -eq 3 ]; then
              echo "Build failed after $i attempts."
              exit 1
            else
              echo "Build failed. Retrying..."
              sleep 10
            fi
          done

    # Continue to the fallback job if this one fails
    continue-on-error: true

  # Fallback Job: Use Docker Cloud Builders
  docker_cloud_builders:
    needs: github_runners
    if: ${{ always() && needs.github_runners.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Log Debug Information
      - name: Log Debug Information
        run: |
          echo "Running job on ${{ runner.os }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Fallback job running due to failure in primary job"

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
          
      # Step 4: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Step 5: Build and Push with Buildx
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USER }}/github-runner-image:latest
          cache-from: type=registry,ref=${{ vars.DOCKER_USER }}/github-runner-image:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_USER }}/github-runner-image:buildcache,mode=max
