name: ci

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  # Primary Job: Use GitHub Runners
  github_runners:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Log Debug Information
      - name: Log Debug Information
        run: |
          echo "Running job on ${{ runner.os }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"

      # Step 3: Clear Docker Cache
      - name: Clear Docker Cache
        run: |
          docker system prune -af

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      # Step 5: Build and Push Image (Retry Mechanism Added)
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          tags: ${{ vars.DOCKER_USER }}/github-runner-image:latest
        retry: 3

    # Continue to the fallback job if this one fails
    continue-on-error: true

  # Fallback Job: Use Docker Cloud Builders
  docker_cloud_builders:
    needs: github_runners
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Log Debug Information
      - name: Log Debug Information
        run: |
          echo "Running job on ${{ runner.os }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      # Step 4: Set up Docker Buildx with Cloud Driver
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "remphan/name"
          install: true

      # Step 5: Build and Push Image with Dynamic Tagging
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          tags: ${{ vars.DOCKER_USER }}/cloud-builder-image:${{ github.run_id }}
        retry: 3
